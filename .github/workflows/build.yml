name: Build Alfred Dashboard Docker Images

# Release streams:
#   alpha          - feature/** branches -> :alpha, :feature-<name>, :sha-<sha>
#   beta           - main branch        -> :beta, :sha-<sha>
#   release        - v* tags            -> :<version>, :latest, :sha-<sha>
#   upstream-alpha - upstream-alpha-* tags -> :upstream-alpha, :upstream-alpha-<tag>, :sha-<sha>
#   upstream-release - upstream-v* tags -> :upstream-release, :upstream-<version>, :sha-<sha>

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*', 'upstream-alpha-*', 'upstream-v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/alfred-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Determine release stream and tags
        id: release
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${GITHUB_REF#refs/heads/}"
          TAG="${GITHUB_REF#refs/tags/}"
          TAGS="$REGISTRY/$IMAGE:sha-$SHORT_SHA"
          STREAM=""
          APP_SHA="$SHORT_SHA"

          validate_tag_component() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "ERROR: $label '$value' is not a valid Docker tag component" >&2
              exit 1
            fi
          }

          if [[ "$GITHUB_REF" == refs/heads/feature/* ]]; then
            FEATURE_NAME="${BRANCH#feature/}"
            SANITIZED_FEATURE_NAME=$(printf '%s' "$FEATURE_NAME" | sed 's|/|-|g; s|[^A-Za-z0-9_.-]|-|g; s|^[.-]*||; s|[.-]*$||')
            if [[ -z "$SANITIZED_FEATURE_NAME" ]]; then
              echo "ERROR: Feature branch name '$BRANCH' does not produce a valid Docker tag suffix" >&2
              exit 1
            fi
            STREAM="alpha"
            TAGS="${TAGS}"$'\n'"$REGISTRY/$IMAGE:alpha"$'\n'"$REGISTRY/$IMAGE:feature-$SANITIZED_FEATURE_NAME"
            APP_SHA="$SHORT_SHA"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            STREAM="beta"
            TAGS="${TAGS}"$'\n'"$REGISTRY/$IMAGE:beta"
            APP_SHA="$SHORT_SHA"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${TAG#v}"
            validate_tag_component "$VERSION" "Release version"
            STREAM="release"
            TAGS="${TAGS}"$'\n'"$REGISTRY/$IMAGE:$VERSION"$'\n'"$REGISTRY/$IMAGE:latest"
          elif [[ "$GITHUB_REF" == refs/tags/upstream-alpha-* ]]; then
            ALPHA_SUFFIX="${TAG#upstream-alpha-}"
            validate_tag_component "upstream-alpha-$ALPHA_SUFFIX" "Upstream alpha Docker tag"
            STREAM="upstream-alpha"
            TAGS="${TAGS}"$'\n'"$REGISTRY/$IMAGE:upstream-alpha"$'\n'"$REGISTRY/$IMAGE:upstream-alpha-$ALPHA_SUFFIX"
          elif [[ "$GITHUB_REF" == refs/tags/upstream-v* ]]; then
            VERSION="${TAG#upstream-v}"
            validate_tag_component "upstream-$VERSION" "Upstream release Docker tag"
            STREAM="upstream-release"
            TAGS="${TAGS}"$'\n'"$REGISTRY/$IMAGE:upstream-release"$'\n'"$REGISTRY/$IMAGE:upstream-$VERSION"
          else
            echo "ERROR: Unrecognized ref: $GITHUB_REF" >&2
            exit 1
          fi

          echo "stream=$STREAM"      >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "app_sha=$APP_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.app_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "Stream : ${{ steps.release.outputs.stream }}"
          echo "Tags   : ${{ steps.release.outputs.tags }}"
